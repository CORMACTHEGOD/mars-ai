name: Train original Mars-1 Mini (manual)

# Initial training also runs automatically when the model code is merged.
# UI-only website changes do not trigger retraining; no AI API key is needed.
on:
  push:
    branches: [main]
    paths:
      - "mars_mini/**"
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps (tiny demo; more steps take longer)"
        required: true
        default: "2500"
        type: choice
        options:
          - "500"
          - "1500"
          - "2500"
          - "4000"

permissions:
  # Required only for publishing the generated ONNX weights to the public
  # GitHub Pages asset directory (the model is not a secret).
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the Mars repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install model export and verification libraries
        run: python -m pip install onnx onnxruntime numpy

      - name: Validate the original model and tokenizer
        run: python -m unittest discover -s tests -v

      - name: Train the original Mars-1 Mini weights
        run: |
          python -m mars_mini.train_dialogue --steps ${{ inputs.steps || '2500' }} --batch-size 16 --log-every 250

      - name: Generate an experimental sample
        run: |
          python -m mars_mini.generate --prompt "hello" --new-tokens 90 > artifacts/mars1-mini/sample.txt
          python -m mars_mini.generate --prompt "who are you?" --new-tokens 90 >> artifacts/mars1-mini/sample.txt
          python -m mars_mini.generate --prompt "what is Python?" --new-tokens 90 >> artifacts/mars1-mini/sample.txt
          cat artifacts/mars1-mini/sample.txt

      - name: Export and verify ONNX weights for the Mars website
        run: python -m mars_mini.export_onnx

      - name: Downloadable model, sample and browser weights
        uses: actions/upload-artifact@v4
        with:
          name: mars-1-mini-trained-weights
          path: |
            artifacts/mars1-mini/
            models/mars1-mini.onnx
          retention-days: 7

      - name: Publish our model weights for free browser inference
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/mars1-mini.onnx
          if git diff --cached --quiet; then
            echo "Model weights are already current."
          else
            git commit -m "build: publish original Mars-1 Mini browser weights [skip ci]"
            git push origin HEAD:main
          fi
